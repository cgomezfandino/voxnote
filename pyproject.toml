[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnote"
version = "0.1.0"
description = "Local meeting recorder and insight extractor — Whisper + Ollama + Obsidian"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cgomezfandino" }]

dependencies = [
    "openai-whisper>=20240930",
    "torch>=2.0",
    "requests>=2.31",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
ui = [
    "streamlit>=1.30",
]
openai = [
    "openai>=1.0",
]
kimi = [
    "openai>=1.0",
]
glm = [
    "zhipuai>=2.0",
]
google = [
    "google-generativeai>=0.3",
]
all-providers = [
    "openai>=1.0",
    "zhipuai>=2.0",
    "google-generativeai>=0.3",
]

[project.scripts]
voxnote = "voxnote.cli:main"
voxnote-ui = "voxnote.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
