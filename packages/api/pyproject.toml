[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnote-api"
version = "0.1.0"
description = "FastAPI backend for Voxnote"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "voxnote",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
voxnote-api = "voxnote_api.main:run"
voxnote-desktop = "voxnote_api.desktop:main"

[tool.setuptools.packages.find]
include = ["voxnote_api*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["voxnote_api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
