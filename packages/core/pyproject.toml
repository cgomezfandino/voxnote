[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnote"
version = "0.1.0"
description = "Local meeting recorder and insight extractor — Whisper + Ollama + Obsidian"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "cgomezfandino" }]

dependencies = [
    "openai-whisper>=20240930",
    "torch>=2.0",
    "requests>=2.31",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "python-docx>=1.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
openai = ["openai>=1.0"]
google = ["google-genai>=0.1"]
anthropic = ["anthropic>=0.40"]
whisperx = ["whisperx>=3.8"]
all-providers = [
    "openai>=1.0",
    "google-genai>=0.1",
    "anthropic>=0.40",
]

[project.scripts]
voxnote = "voxnote.cli:main"

[tool.setuptools.packages.find]
include = ["voxnote*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["voxnote", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
