version: 2
updates:
  # Python — pipeline core
  - package-ecosystem: "pip"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-core-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major bumps are intentionally left ungrouped so each arrives as its own
    # reviewable PR (a major can carry breaking changes).

  # Python — FastAPI backend
  - package-ecosystem: "pip"
    directory: "/packages/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-api-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node — web app (TanStack Start on Cloudflare Workers)
  - package-ecosystem: "npm"
    directory: "/packages/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned on purpose: newer releases ship an onnxruntime-web WASM larger than
      # Cloudflare Workers' 25 MiB per-asset limit, which breaks the deploy. Bump by
      # hand after checking dist/client/assets/*.wasm (see docs/session-handoff.md).
      - dependency-name: "@huggingface/transformers"
      - dependency-name: "onnxruntime-web"
      # typescript-eslint supports TypeScript < 6.1 only; revisit TS 7 when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
