version: 2
updates:
  # Python — pipeline core
  - package-ecosystem: "pip"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-core-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major bumps are intentionally left ungrouped so each arrives as its own
    # reviewable PR (a major can carry breaking changes).

  # Python — FastAPI backend
  - package-ecosystem: "pip"
    directory: "/packages/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-api-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node — Next.js frontend
  - package-ecosystem: "npm"
    directory: "/packages/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
