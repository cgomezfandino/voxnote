name: Deploy Web

# Auto-deploys the web app (TanStack Start) to Cloudflare Workers on pushes to main.
# The Worker serves the app shell + the Ollama CORS proxy route; all ML runs in
# the browser, so the Worker never receives audio, transcripts, or API keys.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — create at https://dash.cloudflare.com/profile/api-tokens
#                           (template: "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID — from your Cloudflare dashboard (Workers & Pages)

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install, lint & build
        run: |
          npm ci
          npm run lint
          npm run build
        working-directory: packages/web

      - name: Deploy
        run: npx wrangler deploy -c dist/server/wrangler.json
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
