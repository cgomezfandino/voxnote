name: Deploy Web

# Auto-deploys the web app to Cloudflare Pages on every push to main.
# Uses wrangler (not Cloudflare's built-in Git integration) because wrangler
# correctly detects the Pages Function at the repo root (functions/api/ollama/),
# which the Git integration misses in a monorepo layout.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — create at https://dash.cloudflare.com/profile/api-tokens
#                           (template: "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID — from your Cloudflare dashboard (Workers & Pages → any project)
#
# IMPORTANT: disable the Cloudflare Pages Git integration for this project to avoid
# duplicate (and function-less) deployments.

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "functions/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build
        working-directory: packages/web

      - name: Deploy
        run: npx wrangler pages deploy packages/web/out --project-name voxnote --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
